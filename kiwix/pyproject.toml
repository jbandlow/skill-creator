[project]
name = "kiwix-tool"
version = "0.1.0"
description = "A programmatic client tool for local Kiwix/Wikipedia access via both HTTP API and Direct ZIM Parsing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "libzim>=3.4.0",
]

[project.scripts]
kiwix-tool = "kiwix_tool.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwix_tool"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
